[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yousini"
version = "3.2.0"
description = "Local Coding Agent สไตล์ Claude Code — shell, เขียน/แก้ไฟล์, web, serve, connect, MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zedxv55" }]
keywords = ["agent", "coding-agent", "claude-code", "llm", "mcp"]
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.urls]
Homepage = "https://github.com/Zedxv55/Yousini"
Repository = "https://github.com/Zedxv55/Yousini"

[project.scripts]
yousini = "yousini:main"

[tool.setuptools]
py-modules = ["yousini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
