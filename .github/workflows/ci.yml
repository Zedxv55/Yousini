name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Verify modules compile
        run: python -m py_compile yousini.py yousini_git.py yousini_scaffold.py yousini_queue.py yousini_lsp.py yousini_config.py yousini_plugins.py yousini_session_io.py yousini_update.py yousini_workflows.py yousini_usage.py