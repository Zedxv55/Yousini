<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Yousini · AI Coding Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --bg:#05060a; --panel:rgba(18,20,32,.68); --stroke:rgba(255,255,255,.08);
  --ink:#eef1ff; --dim:#8b90b4; --brand1:#7c5cff; --brand2:#18d3ff; --brand3:#ff5cae;
  --ok:#3ddc97; --warn:#ffcf5c; --danger:#ff6b6b;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Sora','IBM Plex Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
/* ---------- aurora background ---------- */
.aurora{position:fixed;inset:-30%;z-index:0;filter:blur(80px);opacity:.55;pointer-events:none}
.aurora span{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
.aurora .a{width:46vw;height:46vw;background:var(--brand1);top:-6%;left:-4%}
.aurora .b{width:40vw;height:40vw;background:var(--brand2);bottom:-10%;right:-6%;animation-delay:-6s}
.aurora .c{width:34vw;height:34vw;background:var(--brand3);top:32%;left:38%;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,6%) scale(1.08)}66%{transform:translate(-5%,-4%) scale(.95)}}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 78%)}
/* ---------- layout ---------- */
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:960px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:14px;padding:20px 6px 14px}
.logo{font-weight:800;font-size:26px;letter-spacing:.5px;
  background:linear-gradient(100deg,var(--brand2),var(--brand1) 45%,var(--brand3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(124,92,255,.35))}
.tag{font-size:12px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
  background:var(--panel);border:1px solid var(--stroke);padding:7px 12px;border-radius:999px;backdrop-filter:blur(12px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
.dot.off{background:var(--danger);box-shadow:0 0 10px var(--danger)}
@keyframes pulse{50%{opacity:.4}}
/* ---------- chat ---------- */
#chat{flex:1;overflow-y:auto;padding:8px 4px 20px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:8px}#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
.msg{display:flex;gap:12px;margin:18px 0;animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.avatar{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
.msg.user .avatar{background:linear-gradient(135deg,#2a2d44,#3a3f63);color:#cfd3ff}
.msg.ai .avatar{background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#06070d;box-shadow:0 0 22px rgba(24,211,255,.35)}
.bubble{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:14px 16px;
  backdrop-filter:blur(14px);max-width:100%;line-height:1.65;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.msg.user .bubble{background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(24,211,255,.10));border-color:rgba(124,92,255,.3)}
.bubble p{margin:.4em 0}.bubble pre{background:#0b0d16 !important;border:1px solid var(--stroke);border-radius:12px;padding:12px;overflow:auto;font-family:var(--mono);font-size:13px}
.bubble code{font-family:var(--mono);font-size:.92em}.bubble :not(pre)>code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
.who{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
/* tool chips */
.tool{margin:8px 0;border:1px solid var(--stroke);border-left:3px solid var(--brand2);border-radius:10px;
  background:rgba(24,211,255,.05);font-family:var(--mono);font-size:12.5px;overflow:hidden}
.tool .h{padding:8px 12px;color:var(--brand2);font-weight:600;display:flex;gap:8px;align-items:center}
.tool .b{padding:0 12px 10px;color:var(--dim);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
.cursor{display:inline-block;width:8px;height:1.1em;background:var(--brand2);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* ---------- composer ---------- */
.composer{padding:10px 8px 20px}
.box{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--stroke);
  border-radius:18px;padding:10px 10px 10px 16px;backdrop-filter:blur(16px);
  box-shadow:0 12px 44px rgba(0,0,0,.45);transition:border-color .2s}
.box:focus-within{border-color:rgba(124,92,255,.6);box-shadow:0 0 0 3px rgba(124,92,255,.15),0 12px 44px rgba(0,0,0,.45)}
textarea{flex:1;background:none;border:0;outline:0;color:var(--ink);font-family:var(--sans);font-size:15px;resize:none;max-height:180px;line-height:1.5;padding:6px 0}
textarea::placeholder{color:var(--dim)}
.send{width:44px;height:44px;flex:none;border:0;border-radius:13px;cursor:pointer;color:#06070d;font-size:18px;
  background:linear-gradient(135deg,var(--brand2),var(--brand1));transition:transform .12s,filter .2s}
.send:hover{filter:brightness(1.12)}.send:active{transform:scale(.92)}.send:disabled{opacity:.4;cursor:not-allowed}
.hint{text-align:center;color:var(--dim);font-size:11px;margin-top:10px;letter-spacing:.3px}
.empty{display:grid;place-items:center;height:100%;text-align:center;gap:14px;color:var(--dim)}
.empty h1{font-size:34px;margin:0;background:linear-gradient(100deg,var(--brand2),var(--brand1),var(--brand3));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
.chip{border:1px solid var(--stroke);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--brand1);background:rgba(124,92,255,.12)}
</style>
</head>
<body>
<div class="aurora"><span class="a"></span><span class="b"></span><span class="c"></span></div>
<div class="grid"></div>
<div class="wrap">
  <header>
    <div class="logo">Yousini</div>
    <div class="tag">AI&nbsp;Coding&nbsp;Agent</div>
    <div class="pill"><span class="dot" id="dot"></span><span id="status">เชื่อมต่อแล้ว</span><span id="model" style="opacity:.7"></span></div>
  </header>

  <div id="chat">
    <div class="empty" id="empty">
      <h1>สวัสดี ผม Yousini</h1>
      <p>ผู้ช่วยเขียนโค้ดที่ทำงานบนเครื่องจริงและออนไลน์ได้ — สั่งงานได้เลย</p>
      <div class="chips">
        <div class="chip" onclick="quick(this)">สร้างเว็บ To-Do ด้วย HTML/JS</div>
        <div class="chip" onclick="quick(this)">อธิบายโครงสร้างโปรเจกต์นี้</div>
        <div class="chip" onclick="quick(this)">ค้นหาข่าว AI ล่าสุด</div>
        <div class="chip" onclick="quick(this)">เขียนสคริปต์ backup ไฟล์</div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="พิมพ์คำสั่งถึง Yousini…  (Enter ส่ง · Shift+Enter ขึ้นบรรทัด)"></textarea>
      <button class="send" id="send" title="ส่ง">➤</button>
    </div>
    <div class="hint">Yousini ทำงานบนเครื่องของคุณได้จริง · ตรวจสอบผลลัพธ์ก่อนใช้งานเสมอ</div>
  </div>
</div>

<script>
marked.setOptions({breaks:true, highlight:(c,l)=>{try{return hljs.highlight(c,{language:hljs.getLanguage(l)?l:'plaintext'}).value}catch(e){return c}}});
const chat=document.getElementById('chat'), input=document.getElementById('input'),
      send=document.getElementById('send'), empty=document.getElementById('empty');
let TOKEN=localStorage.getItem('yousini_token')||'';
const SID=localStorage.getItem('yousini_sid')||(Math.random().toString(36).slice(2)+Date.now().toString(36));
localStorage.setItem('yousini_sid',SID);
let busy=false;

function setStatus(ok,msg,model){document.getElementById('dot').className='dot'+(ok?'':' off');
  document.getElementById('status').textContent=msg; if(model)document.getElementById('model').textContent=' · '+model;}
fetch('info').then(r=>r.json()).then(d=>setStatus(true,'เชื่อมต่อแล้ว',d.model)).catch(()=>setStatus(false,'ออฟไลน์'));

input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
send.onclick=go;
function quick(el){input.value=el.textContent;go()}

function addMsg(role,html){ if(empty)empty.remove();
  const m=document.createElement('div');m.className='msg '+role;
  m.innerHTML=`<div class="avatar">${role==='user'?'คุณ':'Y'}</div>`+
    `<div style="min-width:0;flex:1"><div class="who">${role==='user'?'คุณ':'Yousini'}</div><div class="bubble"></div></div>`;
  chat.appendChild(m);chat.scrollTop=chat.scrollHeight;
  const b=m.querySelector('.bubble'); if(html!==undefined)b.textContent=html; return b;}

async function go(){
  const text=input.value.trim(); if(!text||busy)return;
  addMsg('user',text); input.value='';input.style.height='auto';
  busy=true;send.disabled=true;
  const bubble=addMsg('ai'); let acc='';
  const cur=document.createElement('span');cur.className='cursor';bubble.appendChild(cur);
  try{
    const res=await fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json',
      'X-Yousini-Token':TOKEN},body:JSON.stringify({message:text,session:SID})});
    if(res.status===401){const t=prompt('เซิร์ฟเวอร์ต้องใช้ token:');if(t){TOKEN=t;localStorage.setItem('yousini_token',t);busy=false;send.disabled=false;bubble.parentElement.parentElement.remove();return go();}}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const parts=buf.split('\n\n');buf=parts.pop();
      for(const p of parts){const line=p.split('\n').find(x=>x.startsWith('data:'));if(!line)continue;
        const ev=JSON.parse(line.slice(5));
        if(ev.type==='token'){acc+=ev.text;cur.remove();bubble.innerHTML=marked.parse(acc);bubble.appendChild(cur);}
        else if(ev.type==='tool'){cur.remove();
          const t=document.createElement('div');t.className='tool';
          t.innerHTML=`<div class="h">⏺ ${ev.name}</div><div class="b">${esc(ev.args)}</div>`;
          bubble.appendChild(t);bubble.appendChild(cur);}
        else if(ev.type==='tool_result'){const tools=bubble.querySelectorAll('.tool');
          const last=tools[tools.length-1];if(last)last.querySelector('.b').textContent+='\n⎿ '+ev.result;}
        else if(ev.type==='final'){if(ev.text){acc=ev.text;bubble.innerHTML=marked.parse(acc);}}
        else if(ev.type==='error'){bubble.innerHTML+=`<div style="color:var(--danger)">⚠ ${esc(ev.text)}</div>`;}
        chat.scrollTop=chat.scrollHeight;}
    }
  }catch(e){bubble.innerHTML+=`<div style="color:var(--danger)">⚠ การเชื่อมต่อขัดข้อง: ${esc(e.message)}</div>`;setStatus(false,'ออฟไลน์');}
  cur.remove();bubble.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
  busy=false;send.disabled=false;input.focus();
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
</script>
</body>
</html>
